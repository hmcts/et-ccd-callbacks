name: Publish Shared Test Library

on:
  pull_request:
    paths:
      - 'et-shared-test-library/**'

jobs:
  publish-gpr:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@hmcts'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Debug dependency resolution
        run: |
          yarn workspaces list
          yarn workspace @hmcts/et-shared-test-library why @playwright/test
          yarn workspace @hmcts/et-shared-test-library why playwright-core
          yarn workspace @hmcts/et-shared-test-library why @hmcts/playwright-common

      - name: Build package
        run: yarn workspace @hmcts/et-shared-test-library build

      - name: Verify package contents
        run: yarn workspace @hmcts/et-shared-test-library exec npm pack --dry-run

      - name: Verify publish would succeed
        run: yarn workspace @hmcts/et-shared-test-library exec npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
