name: Publish Shared Test Library

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: et-shared-test-library

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Detect et-shared-test-library changes
        id: changes
        working-directory: .
        run: |
          ET_SHARED_TEST_LIBRARY_PATHS=(
            et-shared-test-library
            .github/workflows/publish-shared-test-library.yml
          )
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch - publishing"
            echo "publish=true" >> $GITHUB_OUTPUT
            exit 0
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            RANGE="${BASE}...${HEAD}"
          else
            BASE=$(git describe --tags --abbrev=0 --match 'et-shared-test-library-*' 2>/dev/null || true)
            if [ -z "$BASE" ]; then
              BASE="${{ github.event.before }}"
            fi
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "No previous release tag found - publishing"
              echo "publish=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            RANGE="${BASE}..HEAD"
          fi
          if git diff --quiet "$RANGE" -- "${ET_SHARED_TEST_LIBRARY_PATHS[@]}"; then
            echo "No et-shared-test-library changes in $RANGE - skipping publish"
            echo "publish=false" >> $GITHUB_OUTPUT
          else
            echo "et-shared-test-library changes in $RANGE:"
            git diff --name-only "$RANGE" -- "${ET_SHARED_TEST_LIBRARY_PATHS[@]}"
            echo "publish=true" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Setup Node
        if: steps.changes.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure npm version (Trusted Publishing)
        run: |
          npm --version
          npm i -g npm@11.5.1 --ignore-scripts
          npm --version

      - name: Install dependencies
        if: steps.changes.outputs.publish == 'true'
        run: yarn install --immutable --mode=skip-build

      - name: Build package
        if: steps.changes.outputs.publish == 'true'
        run: yarn build

      - name: Enforce unique package version on npm
        if: steps.changes.outputs.publish == 'true'
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          
          echo "Checking uniqueness for ${PKG_NAME}@${PKG_VERSION}"
          
          if npm view "${PKG_NAME}@${PKG_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "::error::${PKG_NAME}@${PKG_VERSION} already exists on npm. Please bump the version."
            exit 1
          fi
          
          echo "✅ Version ${PKG_VERSION} is available for publishing."

      - name: Publish (OIDC)
        if: steps.changes.outputs.publish == 'true' && github.event_name != 'pull_request'
        run: |
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc-noauth"
          printf "registry=https://registry.npmjs.org/\n" > "$NPM_CONFIG_USERCONFIG"
          printf "@hmcts:registry=https://registry.npmjs.org/\n" >> "$NPM_CONFIG_USERCONFIG"

          npm config delete //registry.npmjs.org/:_authToken || true
          npm config delete _authToken || true

          npm publish --access public
