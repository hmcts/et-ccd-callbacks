name: Publish Shared Test Library

on:
  pull_request:
    paths:
      - 'et-shared-test-library/**'

jobs:
  publish-gpr:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: et-shared-test-library

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@hmcts'

      - name: Debug dependency resolution
        run: |
          yarn install --immutable
          yarn workspaces list
          yarn why @playwright/test
          yarn why playwright-core
          yarn why @hmcts/playwright-common

      - name: Build package
        run: yarn build

      - name: verify build artifacts
        run: |
          ls -l dist
          test -f dist/index.js && test -f dist/index.d.ts && echo "Build artifacts verified"

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Verify publish would succeed
        run: yarn npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
