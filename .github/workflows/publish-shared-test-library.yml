name: Publish Shared Test Library

on:
  pull_request:
    paths:
      - 'et-shared-test-library/**'

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: et-shared-test-library

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure npm version (Trusted Publishing)
        run: |
          npm --version
          npm i -g npm@11.5.1
          npm --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn build

      - name: Enforce unique package version on npm
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          
          echo "Checking uniqueness for ${PKG_NAME}@${PKG_VERSION}"
          
          if npm view "${PKG_NAME}@${PKG_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "::error::${PKG_NAME}@${PKG_VERSION} already exists on npm. Please bump the version."
            exit 1
          fi
          
          echo "✅ Version ${PKG_VERSION} is available for publishing."

      - name: Publish (OIDC)
        run: |
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc-noauth"
          printf "registry=https://registry.npmjs.org/\n" > "$NPM_CONFIG_USERCONFIG"
          printf "@hmcts:registry=https://registry.npmjs.org/\n" >> "$NPM_CONFIG_USERCONFIG"

          npm config delete //registry.npmjs.org/:_authToken || true
          npm config delete _authToken || true

          npm publish --access public --tag beta
