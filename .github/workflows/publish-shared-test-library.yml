name: Publish Shared Test Library

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version to publish for et-shared-test-library (e.g. 1.0.3)'
        required: false
  pull_request:
    branches:
      - master
    paths:
      - 'et-shared-test-library/**'
      - '.github/workflows/publish-shared-test-library.yml'
  push:
    branches:
      - master
    paths:
      - 'et-shared-test-library/**'
      - '.github/workflows/publish-shared-test-library.yml'

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    defaults:
      run:
        working-directory: et-shared-test-library

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only publish when something that ends up in the et-shared-test-library artifact has changed.
      - name: Detect et-shared-test-library changes
        id: changes
        working-directory: .
        run: |
          ET_SHARED_TEST_LIBRARY_PATHS=(
            et-shared-test-library
            .github/workflows/publish-shared-test-library.yml
          )
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch - publishing"
            echo "publish=true" >> $GITHUB_OUTPUT
            exit 0
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            RANGE="${BASE}...${HEAD}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "No previous commit found - publishing"
              echo "publish=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            RANGE="${BASE}..HEAD"
          fi
          if git diff --quiet "$RANGE" -- "${ET_SHARED_TEST_LIBRARY_PATHS[@]}"; then
            echo "No et-shared-test-library changes in $RANGE - skipping publish"
            echo "publish=false" >> $GITHUB_OUTPUT
          else
            echo "et-shared-test-library changes in $RANGE:"
            git diff --name-only "$RANGE" -- "${ET_SHARED_TEST_LIBRARY_PATHS[@]}"
            echo "publish=true" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Setup Node
        if: steps.changes.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure npm version (Trusted Publishing)
        if: steps.changes.outputs.publish == 'true'
        run: |
          npm --version
          npm i -g npm@11.5.1 --ignore-scripts
          npm --version

      - name: Get version
        id: get_version
        if: steps.changes.outputs.publish == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          LATEST_VERSION=$(npm view @hmcts/et-shared-test-library version --registry=https://registry.npmjs.org/ 2>/dev/null || echo '1.0.0')
          NEXT_PATCH=$(echo "$LATEST_VERSION" | awk -F. '{ print $3+1 }')
          NEXT_VERSION="1.0.${NEXT_PATCH}"
          while npm view "@hmcts/et-shared-test-library@$NEXT_VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; do
            NEXT_PATCH=$((NEXT_PATCH + 1))
            NEXT_VERSION="1.0.${NEXT_PATCH}"
          done
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "Next version calculated: $NEXT_VERSION"
        shell: bash

      - name: Set Release Version
        id: set_release_version
        if: steps.changes.outputs.publish == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_VERSION="${{ github.event.inputs.release_version }}"
            if [ -z "$RELEASE_VERSION" ]; then
              LATEST_VERSION=$(npm view @hmcts/et-shared-test-library version --registry=https://registry.npmjs.org/ 2>/dev/null || echo '1.0.0')
              NEXT_PATCH=$(echo "$LATEST_VERSION" | awk -F. '{ print $3+1 }')
              RELEASE_VERSION="1.0.${NEXT_PATCH}"
              while npm view "@hmcts/et-shared-test-library@$RELEASE_VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; do
                NEXT_PATCH=$((NEXT_PATCH + 1))
                RELEASE_VERSION="1.0.${NEXT_PATCH}"
              done
            fi
            echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
            npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH_NAME="$GITHUB_HEAD_REF"
            SAFE_BRANCH_NAME=$(echo "$BRANCH_NAME" | tr -cd 'A-Za-z0-9._-')
            if [ -z "$SAFE_BRANCH_NAME" ]; then
              SAFE_BRANCH_NAME="pr"
            fi
            if [[ "$BRANCH_NAME" == renovate/* ]]; then
              TRANSFORMED_BRANCH_NAME="${SAFE_BRANCH_NAME//\//-}"
            else
              TRANSFORMED_BRANCH_NAME="$SAFE_BRANCH_NAME"
            fi
            SHA=$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH")
            RELEASE_VERSION="0.0.0-${TRANSFORMED_BRANCH_NAME}-${SHA:0:7}"
            echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
            npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version 2>/dev/null || true
          elif [ "${{ github.event_name }}" = "push" ]; then
            RELEASE_VERSION=${{ steps.get_version.outputs.next_version }}
            echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
            npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          fi
        shell: bash

      - name: Install dependencies
        if: steps.changes.outputs.publish == 'true'
        run: yarn install --immutable --mode=skip-build

      - name: Build package
        if: steps.changes.outputs.publish == 'true'
        run: yarn build

      - name: Publish to npm
        if: steps.changes.outputs.publish == 'true' && github.event_name == 'pull_request'
        run: |
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc-noauth"
          printf "registry=https://registry.npmjs.org/\n" > "$NPM_CONFIG_USERCONFIG"
          printf "@hmcts:registry=https://registry.npmjs.org/\n" >> "$NPM_CONFIG_USERCONFIG"

          npm config delete //registry.npmjs.org/:_authToken || true
          npm config delete _authToken || true

          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PKG_VERSION" == *-* ]]; then
            npm publish --access public --tag prerelease
          else
            npm publish --access public
          fi

      - name: Comment Release Version
        if: steps.changes.outputs.publish == 'true' && github.event_name == 'pull_request'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "Validated et-shared-test-library build for PR with version: ${{ steps.set_release_version.outputs.release_version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash