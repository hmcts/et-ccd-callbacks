name: Publish et-shared to Azure Artifacts

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version to publish for et-shared (e.g. 0.0.1)'
        required: false
        default: '0.0.1'
  pull_request:
  push:
    branches:
      - master

jobs:
  PublishToAzureArtifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      # Only publish when something that ends up in the et-shared artifact has changed.
      # Every published version counts towards the feed's 5000-version limit per package.
      - name: Detect et-shared changes
        id: changes
        run: |
          ET_SHARED_PATHS=(
            et-shared
            build.gradle
            settings.gradle
            gradle
            gradlew
            .github/workflows/ado_artifacts_build.yml
          )
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch - publishing"
            echo "publish=true" >> $GITHUB_OUTPUT
            exit 0
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            RANGE="${BASE}...${HEAD}"
          else
            BASE=$(git describe --tags --abbrev=0 --match '1.0.*' 2>/dev/null || true)
            if [ -z "$BASE" ]; then
              echo "No previous release tag found - publishing"
              echo "publish=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            RANGE="${BASE}..HEAD"
          fi
          if git diff --quiet "$RANGE" -- "${ET_SHARED_PATHS[@]}"; then
            echo "No et-shared changes in $RANGE - skipping publish"
            echo "publish=false" >> $GITHUB_OUTPUT
          else
            echo "et-shared changes in $RANGE:"
            git diff --name-only "$RANGE" -- "${ET_SHARED_PATHS[@]}"
            echo "publish=true" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Get version from tags
        id: get_version
        if: steps.changes.outputs.publish == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 --match '1.0.*' || echo '1.0.0')
          NEXT_PATCH=$(echo "$LATEST_TAG" | awk -F. '{ print $3+1 }')
          NEXT_VERSION="1.0.${NEXT_PATCH}"
          while git rev-parse "$NEXT_VERSION" >/dev/null 2>&1; do
            NEXT_PATCH=$((NEXT_PATCH + 1))
            NEXT_VERSION="1.0.${NEXT_PATCH}"
          done
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "Next version calculated: $NEXT_VERSION"
        shell: bash

      - name: Set Release Version
        id: set_release_version
        if: steps.changes.outputs.publish == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_VERSION="${{ github.event.inputs.release_version }}"
            if [ -z "$RELEASE_VERSION" ]; then
              echo "release_version input is required for workflow_dispatch"
              exit 1
            fi
            echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH_NAME="$GITHUB_HEAD_REF"
            SAFE_BRANCH_NAME=$(echo "$BRANCH_NAME" | tr -cd 'A-Za-z0-9._-')
            if [ -z "$SAFE_BRANCH_NAME" ]; then
              SAFE_BRANCH_NAME="pr"
            fi
            if [[ "$BRANCH_NAME" == renovate/* ]]; then
              TRANSFORMED_BRANCH_NAME="${SAFE_BRANCH_NAME//\//-}"
            else
              TRANSFORMED_BRANCH_NAME="$SAFE_BRANCH_NAME"
            fi
            SHA=$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH")
            RELEASE_VERSION="${TRANSFORMED_BRANCH_NAME}-${SHA:0:7}"
            echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            RELEASE_VERSION=${{ steps.get_version.outputs.next_version }}
            echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
            git tag "$RELEASE_VERSION"
            git push origin "$RELEASE_VERSION"
          fi
        shell: bash

      - name: Publish to Azure DevOps Artifacts
        if: steps.changes.outputs.publish == 'true'
        run: |
          ./gradlew :et-shared:publish
        env:
          AZURE_DEVOPS_ARTIFACT_USERNAME: ${{ secrets.AZURE_DEVOPS_ARTIFACT_USERNAME }}
          AZURE_DEVOPS_ARTIFACT_TOKEN: ${{ secrets.AZURE_DEVOPS_ARTIFACT_TOKEN }}
          RELEASE_VERSION: ${{ steps.set_release_version.outputs.release_version }}
        shell: bash

      - name: Comment Release Version
        if: steps.changes.outputs.publish == 'true' && github.event_name == 'pull_request'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "Release version for latest commit is: ${{ steps.set_release_version.outputs.release_version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
